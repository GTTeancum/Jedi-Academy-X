//
// SP JEDI ACADEMY DEFAULT CONFIG
//

unbindall

//
// WEAPONS
//
bind    1               "weapon 1"
bind    2               "weapon 2"
bind    3               "weapon 3"
bind    4               "weapon 4"
bind    5               "weapon 5"
bind    6               "weapon 6"
bind    7               "weapon 7"
bind    8               "weapon 8"
bind	9               "weapon 13"
bind    0               "weapon 9"
bind    -               "weapon 10"
bind	=               "weapon 0"

bind    \           	weapongrabbed
bind    [          	weapprev
bind    ]           	weapnext
bind    mwheelup      	weapprev
bind    mwheeldown    	weapnext

//
// CHARACTER CONTROLS
//
bind    CTRL            +attack
bind    ALT             +altattack
bind    SHIFT           +speed
bind    v           	+strafe
bind    PGUP        	+lookup
bind    PGDN        	+lookdown
bind    END         	centerview
bind    c           	+movedown
bind    SPACE       	+moveup
bind    ENTER           +use
bind    r               +use


bind    UPARROW     	+forward
bind    DOWNARROW   	+back
bind    LEFTARROW   	+left
bind    RIGHTARROW  	+right
bind    w           	+forward
bind    a           	+moveleft
bind    s          	+back
bind    d           	+moveright
bind    ,           	+moveleft
bind    .           	+moveright

//
// FORCE POWERS
//

bind    F1	force_throw
bind    F2	force_pull
bind	F3	force_speed
bind	F4	force_sight

bind	f	+useforce
bind	e	forcenext
bind	q	forceprev

bind 	TAB     datapad
bind 	m       datapad
bind 	p 	"cg_thirdperson !"
bind 	l	saberAttackCycle

//
// INVENTORY
//

//
// QUICK KEYS
//

//single only
bind    F9            "load quick"
bind    F10           "uimenu ingameloadmenu"
bind    F11           "uimenu ingamesavemenu"
bind    F12           "save quick"

//
// MOUSE OPTIONS
//

bind    /           +mlook

//
// MOUSE BUTTONS
//

bind    MOUSE1      +attack
bind    MOUSE2      +altattack
bind    MOUSE3      saberAttackCycle

//
// XBOX DEFAULT CONTROLS
//
// XInput to JOY key:
// Back=JOY1, Left Stick Click=JOY2, Right Stick Click=JOY3, Start=JOY4
// D-pad Up=JOY5, D-pad Right=JOY6, D-pad Down=JOY7, D-pad Left=JOY8
// White=JOY9, Black=JOY10, Left Trigger=JOY11, Right Trigger=JOY12
// Y=JOY13, B=JOY14, A=JOY15, X=JOY16

seta    cl_freelook "1"
seta    cl_run "0"
seta    ui_thumbStickMode "0"
seta    m_pitch "-0.022"
seta    sensitivity "2"
seta    sensitivityY "2"
seta    joy_deadzone "0.18"

bind    JOY12       +attack
bind    JOY10       +altattack
bind    JOY11       +moveup
bind    JOY9        +movedown
bind    JOY15       +use
bind    JOY14       +button2
bind    JOY16       "toggle cl_run"
bind    JOY13       "centerview; zoomoff"
bind    JOY5        +zoom
bind    JOY7        zoomoff
bind    JOY8        weapprev
bind    JOY6        weapnext
bind    JOY1        datapad
bind    JOY2        +use
bind    JOY3        "toggle cg_thirdperson"

//
// CLIENT ENVIRONMENT COMMANDS
//

bind    ~           "toggleconsole"
bind    `           "toggleconsole"

