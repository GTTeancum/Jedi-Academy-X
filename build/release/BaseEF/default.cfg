//
// XBOX DEFAULT CONTROLS
//
// XInput to JOY key:
// Back=JOY1, Left Stick Click=JOY2, Right Stick Click=JOY3, Start=JOY4
// D-pad Up=JOY5, D-pad Right=JOY6, D-pad Down=JOY7, D-pad Left=JOY8
// White=JOY9, Black=JOY10, Left Trigger=JOY11, Right Trigger=JOY12
// Y=JOY13, B=JOY14, A=JOY15, X=JOY16

seta    cl_freelook "1"
seta    cl_run "0"
seta    ui_thumbStickMode "0"
seta    m_pitch "-0.022"
seta    sensitivity "2"
seta    sensitivityY "2"
seta    joy_deadzone "0.18"

bind    JOY12       +attack
bind    JOY11       +altattack
bind    JOY15       +moveup
bind    JOY14        +movedown
bind    JOY15       +use
bind    JOY2       "toggle cl_run"
bind    JOY13       "centerview; zoomoff"
bind    JOY5        +zoom
bind    JOY10        weapprev
bind    JOY9        weapnext
bind    JOY1        datapad
bind    JOY3        "toggle cg_thirdperson"

//
// CLIENT ENVIRONMENT COMMANDS
//

bind    ~           "toggleconsole"
bind    `           "toggleconsole"